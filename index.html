<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Date Jar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Karla:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one phone-first column. Jar on top, the drawn slip under it, then what's left and what's done */
  --night: #14182b;
  --ink: #1e2340;
  --paper: #f3f1ff;
  --muted: #a9acc9;
  --blush: #ff8fa3;
  --gold: #ffd36e;
  --slip: #fff6dc;
  --display: "Gloock", Georgia, serif;
  --body: "Karla", system-ui, sans-serif;
  --hand: "Caveat", "Segoe Print", cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--night);
  color: var(--paper);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.55;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 8%, #ffffff55 50%, transparent 51%),
    radial-gradient(1px 1px at 78% 14%, #ffffff66 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 40% 30%, #ffffff33 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 46%, #ffffff44 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 62%, #ffffff44 50%, transparent 51%);
  background-attachment: fixed;
}
main { max-width: 560px; margin: 0 auto; padding: 36px 20px 64px; display: grid; gap: 34px; }
h1, h2 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.5rem, 11vw, 3.4rem); line-height: 1.05; }
h2 { font-size: 1.45rem; }
.eyebrow { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.hand { font-family: var(--hand); color: var(--gold); font-size: 1.55rem; margin: 6px 0 0; line-height: 1.2; }

.jar-wrap { display: grid; justify-items: center; gap: 16px; }
.jar { width: 210px; height: auto; display: block; }
.jar-count { color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; }

button {
  font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 999px; padding: 12px 22px;
}
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.primary { background: var(--blush); color: var(--night); font-size: 1.05rem; }
.ghost { background: transparent; color: var(--paper); border: 1px solid #ffffff33; }
.gold { background: var(--gold); color: var(--night); }
button:disabled { opacity: .5; cursor: default; }

.slip {
  background: var(--slip); color: var(--night);
  border-radius: 6px; padding: 24px 22px 20px;
  box-shadow: 0 10px 30px #00000055;
  transform: rotate(-1.2deg);
  display: grid; gap: 10px;
}
.slip.pop { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: translateY(-30px) rotate(-6deg) scale(.9); opacity: 0; } to { transform: rotate(-1.2deg); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .slip.pop { animation: none; } }
.slip .tag { font-size: 0.75rem; letter-spacing: .12em; text-transform: uppercase; color: #7a6a3a; }
.slip h2 { font-size: 1.7rem; line-height: 1.15; }
.slip p { margin: 0; font-family: var(--hand); font-size: 1.4rem; line-height: 1.25; }
.slip .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.slip .ghost { color: var(--night); border-color: #14182b44; }
.msg { font-size: 0.9rem; color: #5b4f2c; margin: 0; font-family: var(--body); }

.card { background: var(--ink); border: 1px solid #ffffff14; border-radius: 18px; padding: 20px; }
.list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 2px; }
.list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #ffffff10; }
.list li:last-child { border-bottom: 0; }
.list .t { font-weight: 500; }
.list .d { color: var(--gold); font-family: var(--hand); font-size: 1.25rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.list .k { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: .1em; white-space: nowrap; align-self: center; }
.done-list .t { text-decoration: none; }
.empty { color: var(--muted); margin: 10px 0 0; }

details summary { cursor: pointer; font-weight: 700; color: var(--muted); }
form { display: grid; gap: 10px; margin-top: 14px; }
label { font-size: 0.85rem; color: var(--muted); display: grid; gap: 4px; }
input, select {
  font: inherit; color: var(--paper); background: var(--night);
  border: 1px solid #ffffff2a; border-radius: 10px; padding: 10px 12px; width: 100%;
}
footer { text-align: center; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div id="root">
<main>
  <header>
    <p class="eyebrow">For Bean, from Penguin</p>
    <h1>The Date Jar</h1>
    <p class="hand">27.02.27 was date one. Here's what's next.</p>
  </header>

  <section class="jar-wrap" aria-label="The jar">
    <svg class="jar" viewBox="0 0 210 240" aria-hidden="true">
      <rect x="62" y="8" width="86" height="22" rx="6" fill="#ff8fa3"/>
      <rect x="70" y="28" width="70" height="12" fill="#c96a7c"/>
      <path d="M58 40 h94 c18 0 30 14 30 32 v128 c0 22 -16 34 -36 34 h-82 c-20 0 -36 -12 -36 -34 v-128 c0 -18 12 -32 30 -32z" fill="#ffffff10" stroke="#ffffff55" stroke-width="3"/>
      <g id="slips"></g>
      <path d="M48 70 c0 -10 6 -16 14 -18" stroke="#ffffff55" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M44 90 v70" stroke="#ffffff22" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <span class="jar-count" id="jarCount"></span>
    <button class="primary" type="button" id="draw">Pull a date</button>
  </section>

  <section id="slipArea" aria-live="polite"></section>

  <section class="card" aria-labelledby="done-h">
    <h2 id="done-h">Dates we've done</h2>
    <ul class="list done-list" id="doneList"></ul>
  </section>

  <section class="card" aria-labelledby="left-h">
    <h2 id="left-h">Still in the jar</h2>
    <ul class="list" id="leftList"></ul>
    <details>
      <summary>Add an idea</summary>
      <form id="addForm">
        <label for="newTitle">The date
          <input id="newTitle" required maxlength="80" placeholder="e.g. Sunrise swim at the Forty Foot">
        </label>
        <label for="newNote">A note on the slip
          <input id="newNote" maxlength="120" placeholder="e.g. Bring a flask of tea. Non-negotiable.">
        </label>
        <label for="newTag">Kind of date
          <select id="newTag">
            <option>Cosy</option><option>Out out</option><option>Adventure</option><option>Food</option>
          </select>
        </label>
        <button class="gold" type="submit">Put it in the jar</button>
        <p class="empty" id="addMsg"></p>
      </form>
    </details>
  </section>

  <footer>Made by Penguin. Tap the tag anytime to pull another.</footer>
</main>
</div>
<script id="state" type="application/json">{"ideas":[
{"id":"fire","title":"Dinner at FIRE, then live music","note":"Steak, jazz, and you. Date one.","tag":"Out out","done":"2027-02-27"},
{"id":"strokes","title":"Strokes album night","note":"Is This It, start to finish. Wine, candles, no phones.","tag":"Cosy","done":null},
{"id":"howth","title":"Howth cliff walk and chips","note":"Wrap up. Chips on the pier after.","tag":"Adventure","done":null},
{"id":"pizza","title":"Make pizza from scratch","note":"Dough battle. Loser does the dishes.","tag":"Food","done":null},
{"id":"gig","title":"A gig at Whelan's","note":"Pick a band neither of us knows.","tag":"Out out","done":null},
{"id":"phoenix","title":"Picnic in Phoenix Park","note":"Go early and look for the deer.","tag":"Adventure","done":null},
{"id":"cinema","title":"Late film at the IFI","note":"You pick, I pick the snacks.","tag":"Out out","done":null},
{"id":"blanket","title":"Blanket fort film night","note":"Proper fort. Engineering standards apply.","tag":"Cosy","done":null},
{"id":"forty","title":"Sunrise swim at the Forty Foot","note":"Bring a flask of tea. Non-negotiable.","tag":"Adventure","done":null},
{"id":"brunch","title":"Brunch somewhere new","note":"Neither of us has been. Rules are rules.","tag":"Food","done":null},
{"id":"glendalough","title":"Day trip to Glendalough","note":"Upper lake, packed lunch, sore legs.","tag":"Adventure","done":null},
{"id":"games","title":"Arcade and pints","note":"Best of three. Winner picks the next date.","tag":"Out out","done":null},
{"id":"cook","title":"Cook each other's favourite dinner","note":"Recipes stay secret until the night.","tag":"Food","done":null},
{"id":"stars","title":"Stargazing in the Dublin Mountains","note":"Hot chocolate, a blanket and a star map app.","tag":"Cosy","done":null}
]}</script>
<script id="app">
(function () {
  var state = JSON.parse(document.getElementById("state").textContent);
  var current = null;

  var $ = function (id) { return document.getElementById(id); };
  var left = function () { return state.ideas.filter(function (i) { return !i.done; }); };
  var done = function () { return state.ideas.filter(function (i) { return i.done; }).sort(function (a, b) { return a.done < b.done ? -1 : 1; }); };

  function fmt(iso) {
    var p = iso.split("-");
    return p[2] + "." + p[1] + "." + p[0].slice(2);
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }

  function drawSlips() {
    var g = $("slips"), n = left().length, colors = ["#fff6dc", "#ffd36e", "#ff8fa3", "#f3f1ff"], out = "";
    for (var k = 0; k < Math.min(n, 18); k++) {
      var col = k % 5, row = Math.floor(k / 5);
      var x = 52 + col * 22 + (row % 2) * 10, y = 196 - row * 22;
      var r = ((k * 37) % 50) - 25;
      out += '<rect x="' + x + '" y="' + y + '" width="30" height="16" rx="2" fill="' + colors[k % 4] + '" transform="rotate(' + r + ' ' + (x + 15) + ' ' + (y + 8) + ')"/>';
    }
    g.innerHTML = out;
  }

  function render() {
    var l = left(), d = done();
    drawSlips();
    $("jarCount").textContent = l.length === 1 ? "1 date left in the jar" : l.length + " dates left in the jar";
    $("draw").disabled = l.length === 0;
    $("doneList").innerHTML = d.length ? d.map(function (i, n) {
      return '<li><span class="t">' + (n + 1) + ". " + esc(i.title) + '</span><span class="d">' + fmt(i.done) + "</span></li>";
    }).join("") : '<li class="empty">None yet.</li>';
    $("leftList").innerHTML = l.length ? l.map(function (i) {
      return '<li><span class="t">' + esc(i.title) + '</span><span class="k">' + esc(i.tag) + "</span></li>";
    }).join("") : '<li class="empty">The jar is empty. Time to add more.</li>';
  }

  function showSlip(idea, msg) {
    var a = $("slipArea");
    if (!idea) { a.innerHTML = ""; return; }
    a.innerHTML =
      '<div class="slip pop">' +
        '<span class="tag">' + esc(idea.tag) + "</span>" +
        "<h2>" + esc(idea.title) + "</h2>" +
        (idea.note ? "<p>" + esc(idea.note) + "</p>" : "") +
        '<div class="actions">' +
          '<button class="gold" type="button" id="didIt">We did it</button>' +
          '<button class="ghost" type="button" id="again">Put it back, pull again</button>' +
        "</div>" +
        (msg ? '<p class="msg">' + esc(msg) + "</p>" : "") +
      "</div>";
    $("again").addEventListener("click", draw);
    $("didIt").addEventListener("click", markDone);
  }

  function draw() {
    var l = left();
    if (!l.length) return;
    var pick;
    do { pick = l[Math.floor(Math.random() * l.length)]; } while (l.length > 1 && current && pick.id === current.id);
    current = pick;
    showSlip(current);
  }

  var KEY = "dateJarState.v1";
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && saved.ideas) {
      // Keep ideas from the file, apply this phone's ticks and extra ideas on top.
      var byId = {};
      saved.ideas.forEach(function (i) { byId[i.id] = i; });
      state.ideas.forEach(function (i) { if (!i.done && byId[i.id] && byId[i.id].done) i.done = byId[i.id].done; });
      var known = {};
      state.ideas.forEach(function (i) { known[i.id] = true; });
      saved.ideas.forEach(function (i) { if (!known[i.id]) state.ideas.push(i); });
    }
  } catch (e) {}

  function save(onFail) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); return Promise.resolve(); }
    catch (e) { onFail("This browser won't save. Try opening the link in Safari."); return Promise.resolve(); }
  }

  function markDone() {
    if (!current) return;
    var idea = current, today = new Date();
    var iso = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
    idea.done = iso;
    $("didIt").disabled = true;
    save(function (m) { idea.done = null; render(); showSlip(idea, m); });
    render();
    showSlip(idea, "Ticked off. Nice one.");
  }

  $("draw").addEventListener("click", draw);
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var t = $("newTitle").value.trim();
    if (!t) return;
    var idea = { id: "i" + Date.now(), title: t, note: $("newNote").value.trim(), tag: $("newTag").value, done: null };
    state.ideas.push(idea);
    render();
    $("addMsg").textContent = "In the jar.";
    save(function (m) {
      state.ideas = state.ideas.filter(function (i) { return i.id !== idea.id; });
      render();
      $("addMsg").textContent = m;
    });
  });

  render();
})();
</script>
</body>
</html>
